<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Time Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Time Hub</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1c1e21;--sub:#6b7280;--accent:#3b6cf6;--accent-fg:#fff;--line:#e5e7eb;--danger:#e5484d;--today:#3b6cf6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d24;--fg:#eceef2;--sub:#9aa1ad;--line:#2a2e38;--accent:#6c8cff}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif;padding:12px;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
textarea,input{-webkit-user-select:text;user-select:text}
/* iPad Air (4th gen) landscape = 1180x820 pt: left column = clock (top) + timer/stopwatch (bottom), right half = calendar */
.app{height:100%;width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:12px}
#clock{grid-column:1;grid-row:1}
#calendar{grid-column:2;grid-row:1/3}
.tools{grid-column:1;grid-row:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;min-height:0;min-width:0}
section{display:flex;flex-direction:column;min-height:0;min-width:0;max-width:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px;overflow:hidden}
section>h3{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.08em}
@media (max-width:760px),(max-aspect-ratio:1/1){
  body{overflow:auto}
  .app{height:auto;grid-template-columns:1fr;grid-template-rows:none}
  #clock,#calendar,.tools{grid-column:1;grid-row:auto}
  .tools{grid-template-columns:1fr}
  section{min-height:420px}
}
.big{font-variant-numeric:tabular-nums;font-weight:300;text-align:center;letter-spacing:.02em}
.sub{color:var(--sub);text-align:center}
button.btn{border:0;border-radius:999px;padding:12px 24px;font-size:15px;cursor:pointer;background:var(--accent);color:var(--accent-fg);font-family:inherit}
button.btn.ghost{background:var(--line);color:var(--fg)}
button.btn.danger{background:var(--danger)}
.row{display:flex;justify-content:center;margin-top:20px;flex-wrap:wrap}
.row>*{margin:4px 6px}
/* clock */
.clock-body{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
#clockTime{white-space:nowrap;font-size:8vw;font-size:clamp(48px,9vw,112px);line-height:1.1}
#clockDate{font-size:2.2vw;font-size:clamp(16px,2.2vw,26px);margin-top:6px}
select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:inherit}
/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-head h2{margin:0;font-size:28px;font-weight:600}
.ym select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px 6px;cursor:pointer}
.cal-head button{border:0;background:var(--bg);color:var(--fg);width:44px;height:44px;border-radius:50%;font-size:16px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));width:100%;grid-template-rows:auto repeat(6,minmax(0,1fr));gap:6px;text-align:center;flex:1;min-height:0}
.grid .dow{font-size:15px;color:var(--sub);padding:4px 0}
.grid .d{min-width:0;width:100%;margin:0;padding:0;box-sizing:border-box;-webkit-appearance:none;appearance:none;min-height:0;display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:22px;cursor:pointer;border:0;background:none;color:var(--fg);font-family:inherit}
.grid .d.other{color:var(--sub);opacity:.4}
.grid .d.sun{color:var(--danger)}
.grid .d.sat{color:var(--accent)}
.grid .d.hol{color:var(--danger)}
.grid .d{position:relative}
.grid .d .hn{position:absolute;left:2px;right:2px;bottom:5px;text-align:center;font-size:9px;font-size:max(9px,.9vw);line-height:1.2;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid .d.today{background:var(--today);color:#fff}
.grid .d.sel:not(.today){outline:0;box-shadow:inset 0 0 0 2px var(--accent)}
#calInfo{margin-top:10px;font-size:15px;display:flex;flex-direction:column}
#calInfo>*+*{margin-top:6px}
#calInfo .sub{text-align:left;font-weight:600}
textarea{height:84px;resize:none;font-size:15px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px;font-family:inherit;resize:vertical}
/* timer */
.setter{display:flex;justify-content:center;align-items:flex-end;margin:4px 0;transition:opacity .2s}
.setter.locked{opacity:.4;pointer-events:none}
.setter .col{display:flex;flex-direction:column;align-items:center;margin:0 5px}
.setter .lbl{font-size:12px;color:var(--sub);margin-bottom:2px}
.wwrap{position:relative;width:64px;height:102px}
.wwrap::after{content:"";position:absolute;left:0;right:0;top:34px;height:34px;background:var(--accent);opacity:.12;border-radius:10px;pointer-events:none}
.wheel{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;padding:34px 0;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wi{height:34px;line-height:34px;text-align:center;scroll-snap-align:center;scroll-snap-stop:always;font-size:18px;color:var(--sub);font-variant-numeric:tabular-nums;cursor:pointer}
.wedit{position:absolute;left:0;top:34px;width:100%;height:34px;padding:0;box-sizing:border-box;text-align:center;font-size:22px;font-weight:600;font-family:inherit;background:var(--card);color:var(--fg);border:2px solid var(--accent);border-radius:10px;outline:none;-webkit-user-select:text;user-select:text}
.wi.sel{color:var(--fg);font-weight:600;font-size:22px}
.presets{display:flex;justify-content:center;margin-top:6px;flex-wrap:wrap}
.presets button{margin:3px}
.presets button{border:1px solid var(--line);background:none;color:var(--fg);border-radius:999px;padding:3px 12px;cursor:pointer;font-family:inherit;font-size:13px}
progress{width:100%;height:5px;margin-top:8px;accent-color:var(--accent)}
progress{-webkit-appearance:none;appearance:none;border:0;border-radius:3px;background:var(--line);overflow:hidden}
progress::-webkit-progress-bar{background:var(--line);border-radius:3px}
progress::-webkit-progress-value{background:var(--accent);border-radius:3px}
progress::-moz-progress-bar{background:var(--accent)}
#timerDisplay,#swDisplay{font-size:4.4vw;font-size:clamp(26px,4.4vw,50px)}
.tools .wwrap{width:52px}
.tools .row{flex-wrap:nowrap}
.tools .row{margin-top:6px}
.tools .row>*{margin:0 2px}
.tools .btn{padding:8px 10px;padding:8px clamp(6px,1vw,14px);font-size:12px;font-size:clamp(12px,1.2vw,13px);white-space:nowrap}
/* shorter viewports (e.g. iPad mini in Safari with toolbars): compact the timer card */
@media (max-height:720px) and (min-aspect-ratio:1/1){
  section{padding:10px 14px}
  .setter .lbl{display:none}
  .presets{flex-wrap:nowrap;margin-top:4px}
  .presets button{margin:0 2px;padding:2px 6px;font-size:12px;white-space:nowrap}
  progress{margin-top:6px}
  section .row{margin-top:6px}
  .tools .btn{padding-top:6px;padding-bottom:6px}
}
section .row{margin-top:10px}
section .btn{padding:8px 20px;font-size:14px}
.laps{list-style:none;padding:0;margin:8px 0 0;flex:1;min-height:0;overflow:auto;font-variant-numeric:tabular-nums}
.laps li{display:flex;justify-content:space-between;padding:4px 4px;border-top:1px solid var(--line);font-size:13px}
.laps li.best{color:#2f9e5f}.laps li.worst{color:var(--danger)}
#timerDone{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;font-size:7vw;font-size:clamp(40px,7vw,84px);font-weight:700;color:var(--danger);animation:blink .7s steps(1) infinite}
#timerDone[hidden]{display:none}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div class="app">
  <section id="clock">
    <h3>時計</h3>
    <div class="clock-body">
      <div id="clockTime" class="big">--:--:--</div>
      <div id="clockDate" class="sub"></div>
      <div class="row"><select id="tz"></select></div>
    </div>
  </section>

  <section id="calendar">
    <div class="cal-head">
      <button id="prev" aria-label="前の月">◀</button>
      <h2 class="ym"><select id="calYear" aria-label="年"></select>年 <select id="calMonth" aria-label="月"></select>月</h2>
      <span><button id="todayBtn" style="width:auto;border-radius:999px;padding:0 12px;margin-right:6px">今日</button><button id="next" aria-label="次の月">▶</button></span>
    </div>
    <div class="grid" id="calGrid"></div>
    <div id="calInfo">
      <div id="selLabel" class="sub"></div>
      <textarea id="memo" rows="1" placeholder="この日のメモ"></textarea>
    </div>
  </section>

  <div class="tools">
  <section id="timer">
    <h3>タイマー</h3>
    <div id="timerDisplay" class="big">00:05:00</div>
    <div class="setter" id="setter">
      <div class="col"><span class="lbl">時</span><div class="wwrap"><div class="wheel" id="th" role="listbox" aria-label="時"></div></div></div>
      <div class="col"><span class="lbl">分</span><div class="wwrap"><div class="wheel" id="tm" role="listbox" aria-label="分"></div></div></div>
      <div class="col"><span class="lbl">秒</span><div class="wwrap"><div class="wheel" id="ts" role="listbox" aria-label="秒"></div></div></div>
    </div>
    <div class="presets">
      <button data-s="60">1分</button><button data-s="180">3分</button>
      <button data-s="300">5分</button><button data-s="600">10分</button>
      <button data-s="1500">25分</button>
    </div>
    <progress id="prog" value="0" max="1"></progress>
    <div id="timerDone" hidden>終了</div>
    <div class="row">
      <button class="btn" id="tStart">スタート</button>
      <button class="btn ghost" id="tReset">リセット</button>
    </div>
  </section>

  <section id="stopwatch">
    <h3>ストップウォッチ</h3>
    <div id="swDisplay" class="big">00:00.00</div>
    <div class="row">
      <button class="btn" id="swStart">スタート</button>
      <button class="btn ghost" id="swLap" disabled>ラップ</button>
      <button class="btn ghost" id="swReset">リセット</button>
    </div>
    <ul class="laps" id="laps"></ul>
  </section>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const pad = (n, l = 2) => String(n).padStart(l, "0");
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v === null || v === undefined ? d : v } catch (e) { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} }
};

/* ---- clock ---- */
const zones = ["local", "UTC", "Asia/Tokyo", "America/New_York", "America/Los_Angeles", "Europe/London", "Europe/Paris", "Asia/Shanghai", "Asia/Kolkata", "Australia/Sydney"];
$("#tz").innerHTML = zones.map(z => `<option value="${z}">${z === "local" ? "ローカル時間" : z}</option>`).join("");
$("#tz").value = store.get("tz", "local");
$("#tz").onchange = () => { store.set("tz", $("#tz").value); drawClock(); };

function zoned(tz) {
  const opts = { hour12: false, year: "numeric", month: "numeric", day: "numeric", weekday: "short", hour: "numeric", minute: "numeric", second: "numeric" };
  if (tz !== "local") opts.timeZone = tz;
  const p = {};
  new Intl.DateTimeFormat("ja-JP", opts).formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
  return { h: (+p.hour) % 24, m: +p.minute, s: +p.second, label: `${p.year}年${p.month}月${p.day}日(${p.weekday})` };
}
function drawClock() {
  const t = zoned($("#tz").value);
  $("#clockTime").textContent = `${pad(t.h)}:${pad(t.m)}:${pad(t.s)}`;
  $("#clockDate").textContent = t.label;
}
setInterval(drawClock, 250); drawClock();

/* ---- calendar ---- */
const now = new Date();
let view = new Date(now.getFullYear(), now.getMonth(), 1);
let sel = new Date(now.getFullYear(), now.getMonth(), now.getDate());
const memos = store.get("memos", {});
const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const DOW = ["日", "月", "火", "水", "木", "金", "土"];

/* ---- Japanese public holidays: computed locally (1980-2099), so it works offline ---- */
const holidayCache = {};
function nthMonday(y, m, n) { return 1 + ((1 - new Date(y, m, 1).getDay() + 7) % 7) + (n - 1) * 7; }
function holidaysOf(y) {
  if (holidayCache[y]) return holidayCache[y];
  const h = {};
  holidayCache[y] = h;
  if (y < 1980 || y > 2099) return h;
  const add = (m, d, name) => { h[y + "-" + pad(m) + "-" + pad(d)] = name; };
  const ex = y - 1980, leap = Math.floor(ex / 4);
  add(1, 1, "元日");
  add(1, y >= 2000 ? nthMonday(y, 0, 2) : 15, "成人の日");
  add(2, 11, "建国記念の日");
  if (y >= 2020) add(2, 23, "天皇誕生日");
  add(3, Math.floor(20.8431 + 0.242194 * ex - leap), "春分の日");
  add(4, 29, y >= 2007 ? "昭和の日" : y >= 1989 ? "みどりの日" : "天皇誕生日");
  add(5, 3, "憲法記念日");
  if (y >= 2007) add(5, 4, "みどりの日");
  add(5, 5, "こどもの日");
  if (y === 2020) add(7, 23, "海の日"); else if (y === 2021) add(7, 22, "海の日");
  else if (y >= 2003) add(7, nthMonday(y, 6, 3), "海の日"); else if (y >= 1996) add(7, 20, "海の日");
  if (y === 2020) add(8, 10, "山の日"); else if (y === 2021) add(8, 8, "山の日"); else if (y >= 2016) add(8, 11, "山の日");
  add(9, y >= 2003 ? nthMonday(y, 8, 3) : 15, "敬老の日");
  add(9, Math.floor(23.2488 + 0.242194 * ex - leap), "秋分の日");
  if (y === 2020) add(7, 24, "スポーツの日"); else if (y === 2021) add(7, 23, "スポーツの日");
  else if (y >= 2022) add(10, nthMonday(y, 9, 2), "スポーツの日");
  else if (y >= 2000) add(10, nthMonday(y, 9, 2), "体育の日"); else add(10, 10, "体育の日");
  add(11, 3, "文化の日");
  add(11, 23, "勤労感謝の日");
  if (y >= 1989 && y <= 2018) add(12, 23, "天皇誕生日");
  if (y === 1989) add(2, 24, "大喪の礼");
  if (y === 1990) add(11, 12, "即位礼正殿の儀");
  if (y === 1993) add(6, 9, "結婚の儀");
  if (y === 2019) { add(5, 1, "天皇の即位の日"); add(10, 22, "即位礼正殿の儀"); }
  const sorted = () => Object.keys(h).sort();
  // 国民の休日: a non-Sunday day sandwiched between two holidays
  sorted().forEach(k => {
    const d = new Date(y, +k.slice(5, 7) - 1, +k.slice(8) + 1), n = new Date(y, d.getMonth(), d.getDate() + 1);
    if (!h[key(d)] && h[key(n)] && d.getDay() !== 0 && d.getFullYear() === y) h[key(d)] = "国民の休日";
  });
  // 振替休日: a holiday on Sunday moves to the next day that is not a holiday
  sorted().forEach(k => {
    const d = new Date(y, +k.slice(5, 7) - 1, +k.slice(8));
    if (d.getDay() !== 0 || h[k] === "振替休日") return;
    const n = new Date(y, d.getMonth(), d.getDate() + 1);
    while (h[key(n)]) n.setDate(n.getDate() + 1);
    if (n.getFullYear() === y) h[key(n)] = "振替休日";
  });
  return h;
}
const holidayName = d => holidaysOf(d.getFullYear())[key(d)] || "";

function drawCal() {
  $("#calYear").value = view.getFullYear();
  $("#calMonth").value = view.getMonth();
  const g = $("#calGrid"); g.innerHTML = DOW.map((d, i) => `<div class="dow" style="color:${i == 0 ? "var(--danger)" : i == 6 ? "var(--accent)" : ""}">${d}</div>`).join("");
  const start = new Date(view); start.setDate(1 - view.getDay());
  const today = key(new Date());
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const b = document.createElement("button");
    const hn = holidayName(d);
    b.className = "d" + (d.getMonth() !== view.getMonth() ? " other" : "") + (d.getDay() == 0 ? " sun" : d.getDay() == 6 ? " sat" : "") + (hn ? " hol" : "") + (key(d) === today ? " today" : "") + (key(d) === key(sel) ? " sel" : "");
    b.innerHTML = "<span>" + d.getDate() + (memos[key(d)] ? "•" : "") + "</span>" + "";
    b.onclick = () => { sel = d; if (d.getMonth() !== view.getMonth()) view = new Date(d.getFullYear(), d.getMonth(), 1); drawCal(); };
    g.appendChild(b);
  }
  $("#selLabel").textContent = `${sel.getFullYear()}年${sel.getMonth() + 1}月${sel.getDate()}日(${DOW[sel.getDay()]})${holidayName(sel) ? " " + holidayName(sel) : ""}`;
  $("#memo").value = memos[key(sel)] || "";
}
$("#calYear").innerHTML = Array.from({ length: 201 }, (_, i) => `<option value="${1900 + i}">${1900 + i}</option>`).join("");
$("#calMonth").innerHTML = Array.from({ length: 12 }, (_, i) => `<option value="${i}">${i + 1}</option>`).join("");
$("#calYear").onchange = $("#calMonth").onchange = () => { view = new Date(+$("#calYear").value, +$("#calMonth").value, 1); drawCal(); };
$("#prev").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); drawCal(); };
$("#next").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); drawCal(); };
$("#todayBtn").onclick = () => { const n = new Date(); sel = new Date(n.getFullYear(), n.getMonth(), n.getDate()); view = new Date(n.getFullYear(), n.getMonth(), 1); drawCal(); };
$("#memo").oninput = e => {
  const v = e.target.value.trim();
  if (v) memos[key(sel)] = e.target.value; else delete memos[key(sel)];
  store.set("memos", memos);
};
$("#memo").onchange = drawCal;
drawCal();

/* ---- timer ---- */
let tTotal = 300000, tEnd = 0, tLeft = 300000, tRun = false, tRaf = 0;
const fmtHMS = ms => { const s = Math.ceil(ms / 1000); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`; };
/* drum-roll pickers (CSS scroll-snap): hours 0-12, minutes 0-59, seconds 0-59 */
const WH = 34;
function makeWheel(el, max) {
  el.innerHTML = Array.from({ length: max + 1 }, (_, i) => `<div class="wi" role="option">${pad(i)}</div>`).join("");
  const items = el.children;
  const mark = () => { const v = el.get(); [...items].forEach((it, i) => it.classList.toggle("sel", i === v)); };
  el.get = () => Math.min(max, Math.max(0, Math.round(el.scrollTop / WH)));
  el.set = v => { el.scrollTop = v * WH; mark(); };
  let snapTimer = 0;
  el.addEventListener("scroll", () => {
    mark(); el.dispatchEvent(new Event("input"));
    // fallback for engines without CSS scroll-snap (older iPadOS): settle on the nearest row
    clearTimeout(snapTimer);
    snapTimer = setTimeout(() => { const t = el.get() * WH; if (Math.abs(el.scrollTop - t) > 1) el.scrollTop = t; }, 150);
  }, { passive: true });
  // tap the selected value to type a number; tap any other value to scroll to it
  const edit = () => {
    const box = document.createElement("input");
    box.className = "wedit"; box.type = "tel"; box.setAttribute("inputmode", "numeric"); box.maxLength = 2; box.value = el.get();
    let done = false;
    const finish = ok => {
      if (done) return; done = true;
      const n = parseInt(box.value, 10);
      box.remove();
      if (ok && !isNaN(n)) { el.set(Math.min(max, Math.max(0, n))); el.dispatchEvent(new Event("input")); }
    };
    box.onkeydown = e => { if (e.key === "Enter") finish(true); else if (e.key === "Escape") finish(false); };
    box.oninput = () => { box.value = box.value.replace(/\D/g, ""); };
    box.onblur = () => finish(true);
    el.parentElement.appendChild(box); box.focus(); box.select();
  };
  [...items].forEach((it, i) => it.onclick = () => {
    if (i === el.get()) edit();
    else if (el.scrollTo) el.scrollTo({ top: i * WH, behavior: "smooth" });
    else el.scrollTop = i * WH; // Safari 12 has no Element.scrollTo
  });
  el.set(0);
}
makeWheel($("#th"), 12); makeWheel($("#tm"), 59); makeWheel($("#ts"), 59);
function readSetter() { return ($("#th").get() * 3600 + $("#tm").get() * 60 + $("#ts").get()) * 1000; }
function writeSetter(ms) { const s = Math.round(ms / 1000); $("#th").set(Math.min(12, Math.floor(s / 3600))); $("#tm").set(Math.floor(s / 60) % 60); $("#ts").set(s % 60); }
writeSetter(300000);
function showTimer() {
  $("#setter").classList.toggle("locked", tRun);
  $("#timerDisplay").textContent = fmtHMS(tLeft);
  $("#prog").value = tTotal ? 1 - tLeft / tTotal : 0;
  document.title = tRun ? `${fmtHMS(tLeft)} - Time Hub` : "Time Hub";
}
let audioCtx = null;
function unlockAudio() { // iOS only allows audio after a user gesture, so create/resume the context on Start
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}
function beep() {
  try {
    const ac = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, .3, .6].forEach(o => { const os = ac.createOscillator(), gn = ac.createGain(); os.frequency.value = 880; os.connect(gn); gn.connect(ac.destination); gn.gain.setValueAtTime(.2, ac.currentTime + o); gn.gain.exponentialRampToValueAtTime(.001, ac.currentTime + o + .25); os.start(ac.currentTime + o); os.stop(ac.currentTime + o + .25); });
  } catch (e) {}
}
function tTick() {
  tLeft = Math.max(0, tEnd - Date.now()); showTimer();
  if (tLeft <= 0) { tRun = false; $("#tStart").textContent = "スタート"; $("#timerDone").hidden = false; beep();
    if ("Notification" in window && Notification.permission === "granted") new Notification("タイマー終了");
    showTimer(); return; }
  tRaf = requestAnimationFrame(tTick);
}
$("#tStart").onclick = () => {
  unlockAudio();
  $("#timerDone").hidden = true;
  if (tRun) { tRun = false; cancelAnimationFrame(tRaf); $("#tStart").textContent = "再開"; return; }
  if (tLeft <= 0 || $("#tStart").textContent === "スタート") { tTotal = tLeft = (tLeft > 0 && tLeft !== tTotal) ? tLeft : readSetter(); }
  if (tLeft <= 0) return;
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
  tEnd = Date.now() + tLeft; tRun = true; $("#tStart").textContent = "一時停止"; tTick();
};
$("#tReset").onclick = () => { tRun = false; cancelAnimationFrame(tRaf); $("#timerDone").hidden = true; tTotal = tLeft = readSetter(); $("#tStart").textContent = "スタート"; showTimer(); };
["#th", "#tm", "#ts"].forEach(s => $(s).oninput = () => { if (!tRun) { tTotal = tLeft = readSetter(); $("#tStart").textContent = "スタート"; showTimer(); } });
document.querySelectorAll(".presets button").forEach(b => b.onclick = () => { writeSetter(b.dataset.s * 1000); $("#tReset").click(); });
showTimer();

/* ---- stopwatch ---- */
let swBase = 0, swStart = 0, swRun = false, swRaf = 0, laps = [], lastLap = 0;
const fmtSW = ms => { const c = Math.floor(ms / 10), s = Math.floor(c / 100), m = Math.floor(s / 60); return (m >= 60 ? pad(Math.floor(m / 60)) + ":" : "") + `${pad(m % 60)}:${pad(s % 60)}.${pad(c % 100)}`; };
const swElapsed = () => swBase + (swRun ? performance.now() - swStart : 0);
function swTick() { $("#swDisplay").textContent = fmtSW(swElapsed()); if (swRun) swRaf = requestAnimationFrame(swTick); }
function drawLaps() {
  const splits = laps.map(l => l.split), min = Math.min(...splits), max = Math.max(...splits);
  $("#laps").innerHTML = laps.slice().reverse().map(l => `<li class="${laps.length > 2 ? (l.split === min ? "best" : l.split === max ? "worst" : "") : ""}"><span>ラップ ${l.n}</span><span>${fmtSW(l.split)}</span><span>${fmtSW(l.total)}</span></li>`).join("");
}
$("#swStart").onclick = () => {
  if (swRun) { swBase += performance.now() - swStart; swRun = false; $("#swStart").textContent = "再開"; $("#swLap").disabled = true; cancelAnimationFrame(swRaf); swTick(); }
  else { swStart = performance.now(); swRun = true; $("#swStart").textContent = "ストップ"; $("#swStart").classList.add("danger"); $("#swLap").disabled = false; swTick(); }
  if (!swRun) $("#swStart").classList.remove("danger");
};
$("#swLap").onclick = () => { const t = swElapsed(); laps.push({ n: laps.length + 1, split: t - lastLap, total: t }); lastLap = t; drawLaps(); };
$("#swReset").onclick = () => { swRun = false; cancelAnimationFrame(swRaf); swBase = lastLap = 0; laps = []; $("#laps").innerHTML = ""; $("#swStart").textContent = "スタート"; $("#swStart").classList.remove("danger"); $("#swLap").disabled = true; swTick(); };

/* ---- keep screen on (time display) + offline support ---- */
let wakeLock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && document.visibilityState === "visible") wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", keepAwake);
document.addEventListener("pointerdown", () => { if (!wakeLock || wakeLock.released) keepAwake(); });
keepAwake();
/* SW disabled for test */

document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea,select")) return;
  if (e.code === "Space") { e.preventDefault(); $("#swStart").click(); }
  if (e.key === "t") $("#tStart").click();
  if (e.key === "l" && !$("#swLap").disabled) $("#swLap").click();
});
</script>
</body>
